<!doctype html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Studyspace Orbit — your whole school life in one calm, fast, offline-first workspace.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studyspace">
<title>Studyspace Orbit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
/* Apply the saved theme before first paint so there is never a flash. */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('studyspace.orbit.v1') || '{}').settings || {};
    var th = s.theme || 'auto';
    if (th === 'auto') th = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = th;
    document.documentElement.dataset.accent = s.accent || 'violet';
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<div id="app"><div class="boot"><div class="boot-ring"></div></div></div>
<div id="overlays"></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<noscript><p style="padding:32px;font-family:sans-serif">Studyspace needs JavaScript.</p></noscript>

<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/filebackup.js"></script>
<script src="js/nlp.js"></script>
<script src="js/srs.js"></script>
<script src="js/sound.js"></script>
<script src="js/timer.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/diary.js"></script>
<script src="js/views/focus.js"></script>
<script src="js/views/cards.js"></script>
<script src="js/views/exams.js"></script>
<script src="js/views/grades.js"></script>
<script src="js/views/subjects.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/insights.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/demo.js"></script>
<script src="js/importer.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/app.js"></script>
</body>
</html>
